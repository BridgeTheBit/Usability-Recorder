name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Prepare Windows icon
        shell: pwsh
        run: ./packaging/build_icon.ps1

      - name: Package Atlas
        run: pyinstaller --noconfirm --clean packaging/Atlas.spec

      - name: Bundle FFmpeg beside Atlas
        run: python packaging/bundle_ffmpeg.py

      - name: Confirm desktop resources are packaged
        shell: pwsh
        run: |
          if (-not (Get-ChildItem dist/Atlas -Recurse -File -Filter atlas-icon.png)) {
            throw "The Atlas logo is missing from the packaged app."
          }
          if (-not (Get-ChildItem dist/Atlas -Recurse -File -Filter QtWebEngineProcess.exe)) {
            throw "Qt WebEngine is missing from the packaged app."
          }
          if (-not (Get-ChildItem dist/Atlas -Recurse -File -Filter review.js)) {
            throw "The session preview script is missing from the packaged app."
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/installer | Out-Null
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "1.2.5"
          if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)$') { $version = $Matches[1] }
          & $compiler "/DAppVersion=$version" packaging/Atlas.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Atlas-Windows-Installer
          path: dist/installer/AtlasSetup-*-windows-x64.exe
          if-no-files-found: error

      - name: Attach installer to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/installer/AtlasSetup-*-windows-x64.exe
